name: Github Actions Demo

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '15 6 * * 0'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment for the workflow'
        type: environment
        required: true

permissions:
  contents: read

cache-mode: none

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Output the name of the event that triggered the workflow
        run: 'echo "Event name: ${{ github.event_name }}"'

      - name: Output the name of the branch that the repository is currently referencing
        run: 'echo "Branch name: ${{ github.ref_name }}"'

      - name: List all files in the repository
        run: ls -R

  Test:
    runs-on: ubuntu-latest
    needs: [Build]
    if: github.event_name == 'workflow_dispatch'
    environment: Test

    steps:
      - name: Run tests
        run: echo "Testing..."

  Load-Test:
    runs-on: ubuntu-latest
    needs: [Build]
    if: github.event_name == 'workflow_dispatch'
    environment: Load-Test

    steps:
      - name: Run load tests
        run: |
          echo "Testing..."
          sleep 15

  Production:
    runs-on: ubuntu-latest
    needs: [Test, Load-Test]
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'Production'
    environment:
      name: Production
      url: https://writeabout.net

    steps:
      - name: Deploy step 1
        run: |
          echo "Step 1 deploying..."
          sleep 10
      - name: Deploy step 2
        run: |
          echo "Step 2 deploying..."
          sleep 10
      - name: Deploy step 3
        run: |
          echo "Step 3 deploying..."
          sleep 10
      - name: Deploy step 4
        run: |
          echo "Step 4 deploying..."
          sleep 10
      - name: Deploy step 5
        run: |
          echo "Step 5 deploying..."
          sleep 10