name: Github Actions Demo

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '15 6 * * 0'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment for the workflow'
        type: environment
        required: true

permissions:
  contents: read

  cache-mode: none

jobs: 
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Output the name of the event that triggered the workflow
        run: 'echo "Event name: ${{ github.event_name }}"'

      - name: Output the name of the branch that the repository is currently referencing
        run: 'echo "Branch name: ${{ github.ref_name }}"'

      - name: List all files in the repository
        run: ls -R