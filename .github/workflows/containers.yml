name: Containers Workflow

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  steps-container:
    runs-on: ubuntu-latest
    steps:
      - name: On the container
        run: cat /etc/os-release

      - name: In an Alpine container
        uses: docker://alpine:latest
        with:
          entrypoint: /bin/sh
          args: -c "cat /etc/os-release"

  job-container:
    runs-on: ubuntu-latest
    container:
      image: node:22-bookworm-slim
      env:
        MY_SETTING: from-the-container-block
    steps:
      - run: |
          node --version
          cat /etc/os-release
          echo "MY_SETTING is $MY_SETTING"

